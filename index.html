<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Dopes Student Accommodation - MSU Off-Campus Housing</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://www.dopesaccommodation.agency/" />
    <link rel="apple-touch-icon" href="https://www.dopesaccommodation.agency/student_accommodation_hero_1779802930883.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://www.dopesaccommodation.agency/student_accommodation_hero_1779802930883.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="https://www.dopesaccommodation.agency/student_accommodation_hero_1779802930883.png" />

    <!-- Beautiful Open Graph sharing cards for WhatsApp / Social previews -->
    <meta property="og:title" content="DOPES MSU Student Accommodation Agency" />
    <meta property="og:description" content="Secure high-quality student housing near Midlands State University. View beautiful off-campus rooms, configure flexible deposit options, and book instantly with live support!" />
    <meta property="og:url" content="https://www.dopesaccommodation.agency/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DOPES Student Accommodation Agency" />

    <!-- Multi-URL & Multi-secure OG Images for maximum cross-platform compatibility -->
    <meta property="og:image" content="https://www.dopesaccommodation.agency/student_accommodation_hero_1779802930883.png" />
    <meta property="og:image:secure_url" content="https://www.dopesaccommodation.agency/student_accommodation_hero_1779802930883.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1000" />
    <meta property="og:image:height" content="1000" />

    <!-- Secondary fallback OG Images for standard non-www domain -->
    <meta property="og:image" content="https://dopesaccommodation.agency/student_accommodation_hero_1779802930883.png" />
    <meta property="og:image:secure_url" content="https://dopesaccommodation.agency/student_accommodation_hero_1779802930883.png" />

    <!-- Old parser/high-compatibility formats -->
    <link rel="image_src" href="https://www.dopesaccommodation.agency/student_accommodation_hero_1779802930883.png" />
    <meta itemprop="image" content="https://www.dopesaccommodation.agency/student_accommodation_hero_1779802930883.png" />

    <!-- Twitter Card metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DOPES MSU Student Accommodation Agency" />
    <meta name="twitter:description" content="Secure your Midlands State University student room with flexible deposit options!" />
    <meta name="twitter:image" content="https://www.dopesaccommodation.agency/student_accommodation_hero_1779802930883.png" />

    <!-- Smart dynamic origin updater to enhance link sharing previews across platforms -->
    <script>
      (function() {
        try {
          const currentOrigin = window.location.origin;
          
          // Helper to substitute placeholder domains if we are running in development or shared environments
          if (window.location.hostname && !window.location.hostname.includes('dopesaccommodation.agency')) {
            // Update Canonical Link
            const canonicalLink = document.querySelector('link[rel="canonical"]');
            if (canonicalLink) {
              canonicalLink.setAttribute('href', currentOrigin + '/');
            }
            
            // Update Open Graph tags
            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) {
              ogUrl.setAttribute('content', currentOrigin + '/');
            }
            
            // Update Open Graph and Twitter Card images
            document.querySelectorAll('meta[property^="og:image"], meta[name="twitter:image"], meta[itemprop="image"], link[rel="image_src"]').forEach(el => {
              const attrName = el.hasAttribute('content') ? 'content' : 'href';
              let val = el.getAttribute(attrName);
              if (val && val.includes('dopesaccommodation.agency')) {
                el.setAttribute(attrName, val.replace('https://www.dopesaccommodation.agency', currentOrigin));
              }
            });
          }
        } catch (e) {
          console.warn("Failed resolving dynamic sharing tags: ", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
